<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Responsive Tone theme selector</title><desc id="desc">Desktop preview of a theme selector with Light, Dark, and System choices.</desc>
  <rect width="1200" height="800" fill="#f7f8f5"/><circle cx="1180" cy="760" r="240" fill="#e6f0e8"/>
  <g font-family="Arial, sans-serif" fill="#25312d"><rect x="66" y="34" width="30" height="30" rx="10" fill="#287b61"/><text x="76" y="56" font-size="19" font-weight="700" fill="white">t</text><text x="106" y="56" font-size="22" font-weight="700">tone</text><circle cx="1021" cy="50" r="4" fill="#70ae83"/><text x="1035" y="55" font-size="13" fill="#7d8983">A tiny theme demo</text>
  <text x="116" y="252" font-size="12" font-weight="700" letter-spacing="2" fill="#287b61">A LITTLE MORE YOU</text><text x="112" y="336" font-size="72" font-weight="700" letter-spacing="-4">Your space,</text><text x="112" y="411" font-size="72" font-weight="700" letter-spacing="-4" fill="#287b61">your light.</text><text x="116" y="464" font-size="16" fill="#7d8983">A calmer corner of the internet. Pick a look that</text><text x="116" y="490" font-size="16" fill="#7d8983">feels right, or let your device decide.</text>
  <rect x="640" y="190" width="450" height="420" rx="20" fill="white" stroke="#e9eeea"/><rect x="668" y="219" width="43" height="43" rx="14" fill="#edf6f1"/><text x="678" y="249" font-size="25" fill="#287b61">◐</text><text x="725" y="237" font-size="17" font-weight="700">Appearance</text><text x="725" y="255" font-size="11" fill="#7d8983">Choose how Tone looks on this device.</text>
  <rect x="667" y="281" width="396" height="78" rx="13" fill="#edf6f1" stroke="#287b61"/><rect x="679" y="301" width="54" height="38" rx="7" fill="#fff" stroke="#e8ece9"/><rect x="685" y="308" width="27" height="4" rx="2" fill="#8dbc9f"/><rect x="685" y="316" width="41" height="4" rx="2" fill="#dce6df"/><rect x="685" y="324" width="33" height="4" rx="2" fill="#dce6df"/><text x="746" y="315" font-size="13" font-weight="700">Light</text><text x="746" y="334" font-size="11" fill="#7d8983">Bright &amp; clear</text><circle cx="1038" cy="320" r="9" fill="#287b61"/><text x="1034" y="324" font-size="10" fill="white">✓</text>
  <rect x="667" y="368" width="396" height="78" rx="13" fill="white" stroke="#e9eeea"/><rect x="679" y="388" width="54" height="38" rx="7" fill="#25312d"/><rect x="685" y="395" width="27" height="4" rx="2" fill="#8dbc9f"/><rect x="685" y="403" width="41" height="4" rx="2" fill="#52635a"/><rect x="685" y="411" width="33" height="4" rx="2" fill="#52635a"/><text x="746" y="402" font-size="13" font-weight="700">Dark</text><text x="746" y="421" font-size="11" fill="#7d8983">Easy on the eyes</text><circle cx="1038" cy="407" r="9" fill="white" stroke="#dfe6e1"/>
  <rect x="667" y="455" width="396" height="78" rx="13" fill="white" stroke="#e9eeea"/><path d="M686 475h41v38h-41z" fill="#25312d"/><path d="M686 475h20v38h-20z" fill="white"/><path d="M691 483h14v4h-14zm0 8h30v4h-30zm0 8h25v4h-25z" fill="#dce6df"/><text x="746" y="489" font-size="13" font-weight="700">System</text><text x="746" y="508" font-size="11" fill="#7d8983">Follow your device</text><circle cx="1038" cy="494" r="9" fill="white" stroke="#dfe6e1"/>
  <path d="M669 558h392" stroke="#e9eeea"/><text x="679" y="586" font-size="14" fill="#b89e63">✳</text><text x="700" y="586" font-size="11" fill="#7d8983">Looking bright and lovely.</text><text x="66" y="765" font-size="11" fill="#7d8983">Made for every kind of day</text><text x="207" y="765" font-size="13" fill="#287b61">✳</text></g>
</svg>
